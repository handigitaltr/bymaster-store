# GitHub Pages: ByMaster statik vitrini (katalog, ürünler, tarifler, bilgi sayfaları).
# Sepet, ödeme, üyelik ve yönetim paneli sunucu gerektirdiği için bu yayında yoktur; bkz. README ve scripts/build-pages.mjs.
# Kurulum: depo Settings → Pages → Build and deployment → Source: "GitHub Actions".
name: GitHub Pages (statik vitrin)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - id: pages
        uses: actions/configure-pages@v5
      - run: npm ci
      - run: npm run pages:build
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          PAGES_SITE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .pages-build/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
